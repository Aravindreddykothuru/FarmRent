# FarmRent — full local stack.
#
#   node scripts/setup-local-env.js        # once: generates .env + Backend_Node_legacy/.env
#   docker compose up -d db rest gateway redis
#   npm run migrate && npm run seed         # schema + demo data
#   npm run dev                             # app on http://localhost:3000
#
# Or run everything (including the app image) in containers:
#   docker compose --profile app up --build
#
# db + rest + gateway emulate the parts of Supabase the backend uses
# (Postgres + PostgREST behind /rest/v1), so no hosted project is needed locally.

name: farmrent

services:
  db:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run node scripts/setup-local-env.js}
      POSTGRES_DB: farmrent
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/local/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d farmrent"]
      interval: 3s
      timeout: 3s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/farmrent
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET missing - run node scripts/setup-local-env.js}
      PGRST_DB_CHANNEL_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    ports:
      - "${SUPABASE_GATEWAY_PORT:-54321}:80"
    volumes:
      - ./infra/local/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rest
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build: .
    command: ["node", "Backend_Node_legacy/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/farmrent
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["app"]
    build: .
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: http://localhost:${APP_PORT:-3000}
      ALLOWED_ORIGINS: http://localhost:${APP_PORT:-3000}
      SUPABASE_URL: http://gateway
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY missing - run node scripts/setup-local-env.js}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing - run node scripts/setup-local-env.js}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET missing - run node scripts/setup-local-env.js}
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
