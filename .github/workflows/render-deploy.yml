name: Render Deploy

# Render's own auto-deploy is turned off for this service, and this workflow is the only thing that ships it.
#
# Two reasons. Render deploys a push the moment it arrives, so a commit that fails the tests reaches production
# and is found there; here the deploy is a job that needs CI, and a red suite simply never gets to it. And
# Render's GitHub connection is a browser authorisation that silently stops delivering — which is exactly what
# happened to this service, whose autoDeploy read "yes" while no push ever produced a deploy. A workflow that
# calls the API leaves a run in the Actions tab whether it worked or not.
on:
  push:
    branches: [audit/farmrent-refactor]
  workflow_dispatch:

permissions:
  contents: read

# Deploys are queued rather than cancelled: cutting one off mid-update leaves the service on a half-applied
# release, and the next push would have no way of knowing what is actually running.
concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Render
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger the deploy
        id: trigger
        run: |
          set -uo pipefail
          # Pinned to the commit CI just proved, not to whatever the branch tip happens to be by now.
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$GITHUB_SHA" '{clearCache:"do_not_clear", commitId:$c}')" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")

          case "$code" in
            200|201|202) ;;
            401|403)
              # Secrets are read when the run is queued, not when this job starts, so a key rotated while the
              # suite was running leaves the job holding the previous one. That is worth saying outright: the
              # request is indistinguishable from a key that was never valid.
              echo "::error::Render rejected the API key (HTTP $code). If it was rotated while this run was in \
          progress, the run is still holding the previous key - update RENDER_API_KEY and start a new run."
              cat response.json >&2 || true
              exit 1
              ;;
            *)
              echo "::error::Render refused the deploy request (HTTP $code)."
              cat response.json >&2 || true
              exit 1
              ;;
          esac
          response=$(cat response.json)

          # Asked for a particular commit, Render answers 202 with an empty body rather than the 201-and-a-deploy
          # it returns for an unpinned request, so the deploy has to be found afterwards by the commit it is for.
          deploy_id=$(jq -r '.id // empty' <<<"${response:-}" 2>/dev/null || true)

          for _ in $(seq 1 30); do
            [ -n "$deploy_id" ] && break
            sleep 2
            deploy_id=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=20" \
              | jq -r --arg c "$GITHUB_SHA" '[.[] | (.deploy // .) | select(.commit.id == $c)] | sort_by(.createdAt) | last | .id // empty')
          done

          if [ -z "$deploy_id" ]; then
            echo "::error::Render accepted the request but no deploy for ${GITHUB_SHA:0:7} appeared within 60s."
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Deploying ${GITHUB_SHA:0:7} as $deploy_id"

      - name: Wait for it to go live
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 1800 ))
          last=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status // "unknown"')

            if [ "$status" != "$last" ]; then
              echo "$(date -u +%H:%M:%S)  $status"
              last="$status"
            fi

            case "$status" in
              live)
                echo "Live."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render ended the deploy as '$status'. The build log is in the Render dashboard."
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Still '$last' after 30 minutes; giving up rather than reporting a deploy that never landed."
          exit 1

      - name: Confirm the running service answers
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          set -euo pipefail
          # "live" means Render started the container. It does not mean the application is serving, so the
          # release is not called good until the process says so itself.
          body=$(curl -sS --fail-with-body --retry 10 --retry-delay 5 --retry-all-errors --max-time 45 \
            "${SERVICE_URL}/health")
          echo "$body"
          jq -e '.status == "ok"' <<<"$body" > /dev/null
