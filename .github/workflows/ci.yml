name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint --if-present

  frontend-lint:
    name: Frontend Lint + Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextfrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextfrontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint --if-present
      - run: npx tsc --noEmit

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t farmrent-backend ./Backend
      - name: Build frontend image
        run: docker build -t farmrent-frontend ./nextfrontend
