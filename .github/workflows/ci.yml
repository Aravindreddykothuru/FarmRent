name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint --if-present

  frontend-lint:
    name: Frontend Lint + Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextfrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextfrontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint --if-present
      - run: npx tsc --noEmit

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build unified production image
        run: docker build -t farmrent . --file Dockerfile

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: 1ff35be7-e2b9-425a-b20d-113e481fdcc3
          RAILWAY_ENVIRONMENT_ID: c68ae821-42bf-42b7-8cbe-5088e53d7d4d
        run: |
          cd nextfrontend
          RAILWAY_TOKEN=$RAILWAY_TOKEN railway up --service $RAILWAY_SERVICE_ID --environment production --detach
