name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, migrations, unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Backend_Node_legacy
    env:
      FARMRENT_ENV_FILE: .env.ci
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-node@0a44ba7841725637a19997854c61726a5d11f3d6 # v4.0.3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend_Node_legacy/package-lock.json

      - name: Start local stack (Postgres + PostgREST gateway + Redis)
        working-directory: .
        run: |
          node scripts/setup-local-env.js --backend-out Backend_Node_legacy/.env.ci
          docker compose up -d --wait db rest gateway redis

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run test:unit

      - name: Migrate twice (the second run must apply nothing)
        run: |
          npm run migrate
          npm run migrate | tee second-run.log
          grep -q "0 applied" second-run.log

      - run: npm run seed
      - run: npm run test:integration

  frontend:
    name: Frontend — lint, type check, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nextfrontend
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-node@0a44ba7841725637a19997854c61726a5d11f3d6 # v4.0.3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextfrontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check:links
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  acceptance:
    name: Acceptance — rental journey over HTTP + browser smoke
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FARMRENT_ENV_FILE: .env.ci
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-node@0a44ba7841725637a19997854c61726a5d11f3d6 # v4.0.3
        with:
          node-version: 20

      - name: Start local stack
        run: |
          node scripts/setup-local-env.js --backend-out Backend_Node_legacy/.env.ci
          docker compose up -d --wait db rest gateway redis

      - name: Install
        run: |
          npm --prefix Backend_Node_legacy ci --legacy-peer-deps
          npm --prefix nextfrontend ci --legacy-peer-deps

      - name: Migrate and seed
        working-directory: Backend_Node_legacy
        run: |
          npm run migrate
          npm run seed

      - name: "Start the app (development mode: the acceptance flow reads dev OTPs)"
        working-directory: nextfrontend
        run: |
          FARMRENT_ENV_FILE=../Backend_Node_legacy/.env.ci nohup node server.js > ../server.log 2>&1 &
          curl -sf --retry 60 --retry-connrefused --retry-delay 2 http://localhost:3000/api/v1/health

      - name: Section 11 acceptance script
        working-directory: Backend_Node_legacy
        run: node scripts/e2e-acceptance.js --base-url http://localhost:3000 --reset-rate-limits

      - name: Browser smoke (every page, console errors, UI rental journey, mobile, sign-out)
        working-directory: nextfrontend
        run: npm run ui:smoke -- --base-url http://localhost:3000

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
