# Local Supabase-compatible API gateway.
# supabase-js calls <SUPABASE_URL>/rest/v1/<table>; PostgREST serves /<table>.
server {
    listen 80;
    client_max_body_size 10m;

    location = /health {
        access_log off;
        return 200 'ok';
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
